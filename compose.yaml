name: auction-platform
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: auction
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.1.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "auction.events", "--partitions", "3", "--replication-factor", "1"]
  migrate:
    build: .
    image: auction-platform:local
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://auction:auction@postgres:5432/auction?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    image: auction-platform:local
    command: ["api"]
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment: &app-env
      DATABASE_URL: postgres://auction:auction@postgres:5432/auction?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: auction.events
      KAFKA_GROUP: auction-api
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-1000}
      WS_MAX_PER_AUCTION: ${WS_MAX_PER_AUCTION:-100}
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-4}
      OUTBOX_RETENTION_HOURS: ${OUTBOX_RETENTION_HOURS:-168}
    depends_on:
      migrate: {condition: service_completed_successfully}
  publisher:
    image: auction-platform:local
    build: .
    command: ["publisher"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
  lifecycle:
    image: auction-platform:local
    build: .
    command: ["lifecycle"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
  tests:
    image: golang:1.27.3-bookworm
    profiles: ["test"]
    working_dir: /src
    volumes:
      - .:/src
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://auction:auction@postgres:5432/auction?sslmode=disable
      KAFKA_TEST_BROKERS: kafka:29092
      CGO_ENABLED: "1"
    command: ["go", "test", "-race", "-count=1", "-timeout=180s", "./..."]
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
volumes:
  postgres-data:
  kafka-data:
  go-modules:
  go-build:
